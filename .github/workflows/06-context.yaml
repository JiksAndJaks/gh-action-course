name: 06 - Contexts
run-name: 06 - Contexts | DEBUG - $${{inputs.debug}}
on:
    push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false

env:
    MY_WORKFLOW_VAR: "workflow"
    MY_OVERWRITTEN_VAR: "workflow"
jobs:
    echo:
        runs-on: ubuntu-latest
        env:
            MY_JOB_VAR: "job"
            MY_OVERWRITTEN_VAR: "job"
        steps:
            - name: Display Information
              run: |
                  echo "This workflow runs on push events."
                  echo "Repository: ${{ github.repository }}"
                  echo "Event Name: ${{ github.event_name }}"
                  echo "Ref: ${{ github.ref }}"
                  echo "SHA: ${{ github.sha }}"
                  echo "Actor: ${{ github.actor }}"
                  echo "Workflow: ${{ github.workflow }}"
                  echo "Run ID: ${{ github.run_id }}"
                  echo "Run Number: ${{ github.run_number }}"
            - name: Retrieve Variable
              run: |
                  echo "Variable Value: ${{ vars.MY_VAR }}"
            - name: Print Environment Variable With Override
              env:
                  MY_OVERWRITTEN_VAR: "step"
              run: |
                  echo "Workflow Environment Variable WORKFLOW: ${{ env.MY_WORKFLOW_VAR }}"
                  echo "Workflow Environment Variable JOB : ${{ env.MY_JOB_VAR }}"
                  echo "Workflow Environment Variable: ${{ env.MY_OVERWRITTEN_VAR}}"
            - name: Print Environment Variable
              run: |
                  echo "Workflow Environment Variable WORKFLOW: ${{ env.MY_WORKFLOW_VAR }}"
                  echo "Workflow Environment Variable JOB : ${{ env.MY_JOB_VAR }}"
                  echo "Workflow Environment Variable: ${{ env.MY_OVERWRITTEN_VAR}}"
