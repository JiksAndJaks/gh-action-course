name: 07 - Usng Expressions

on:
    push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false

jobs:
    echo-data:
        runs-on: ubuntu-latest
        steps:
            - name: "[debug] Print start-up information"
              if: ${{ inputs.debug}}
              run: |
                  echo "Triggered by: ${{ github.event_name }}"
                  echo "Branch: ${{ github.ref }}"
                  echo "Commit SHA: ${{ github.sha }}"
                  echo "Runner OS : ${{ runner.os }}"
            - name: "[debug] Print when triggered from main branch"
              if: ${{ inputs.debug &&github.ref == 'refs/heads/main' }}
              run: |
                  echo "This workflow was triggered from the main branch."
            - name: Greeting
              run: |
                  echo "Hello, ${{ github.actor }}! Welcome to the 07 - Using Expressions workflow."
